spring.application.name=federate
spring.liquibase.change-log=db/changelog/db.changelog-master.json
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=none
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://token.actions.githubusercontent.com/.well-known/openid-configuration
federate.token-prefix=${TOKEN_PREFIX:156_}